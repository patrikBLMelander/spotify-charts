# Server Configuration
server.port=8080

# Data source of truth: weekly chart JSON files served by JsonChartService.
# No database — update by editing files under this directory and pushing.
# On Railway the files are baked into the image at /app/data (see Dockerfile.railway).
data.directory=${DATA_DIRECTORY:../data}

# Logging
logging.level.com.top50=INFO
logging.level.org.springframework.web=INFO
